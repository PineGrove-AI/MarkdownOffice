name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: pandoc/actions/setup@v1

      - uses: typst-community/setup-typst@v4

      # Slides need Node + npm for Astro; --pdf uses the runner's Google Chrome
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Smoke test
        run: deno task test

      - name: Upload smoke test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: test/out

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mdo-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: mdo-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: mdo-darwin-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: mdo-darwin-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Inject version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "export const version: string = \"${VERSION}\";" > lib/version.ts

      - name: Compile
        run: |
          deno compile -A \
            --target ${{ matrix.target }} \
            --include templates \
            --output ${{ matrix.artifact }} \
            main.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
